name: Daily Flood EWS Engine

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Spatial Tools (GDAL & Whitebox)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin
          pip install whitebox

      - name: Run Spatial Engine
        run: python run_daily_ews.py

      - name: Commit and Push COGs to Storage
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add cog_flood_*.tif
          git commit -m "Auto-update: Daily Flood COGs" || echo "No changes to commit"
          git push
