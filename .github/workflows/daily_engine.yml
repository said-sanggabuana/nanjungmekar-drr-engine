name: Daily Flood EWS Engine

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual button clicks

jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      # THIS IS THE CRITICAL MISSING STEP
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests whitebox rasterio numpy
          
      - name: Run Spatial Engine
        run: python run_daily_ews.py
        
      - name: Commit and Push generated COGs
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "Auto-update: Daily Flood COGs (Live Data)" || exit 0
          git push
